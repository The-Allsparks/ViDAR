version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /java-pure
    schedule:
      interval: monthly
    ignore:
      # JUnit 6 needs Java 17; Hub libraries still compile tests for Java 8 bytecode.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
